name: main - Bygg, test og publiser

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Bygg, test og publiser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Generer versjonsnummer
        run: |
          VERSION=$(TZ="Europe/Oslo" date +%Y%m%d.%H%M)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "### Versjonsnummer $VERSION" >> $GITHUB_STEP_SUMMARY

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: gradle build publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew -Pversion="$VERSION" build publish --build-cache
